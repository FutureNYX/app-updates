<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AREPO</title>
<style>
  /* Two typefaces and one colour family, so the interface belongs to the same
     world as the mark and the rain behind it: Georgia for anything that is
     spoken, a monospace for anything read as a setting, and everything tinted
     green rather than the neutral blue-grey this started as. Surfaces are
     translucent on purpose, so the rain runs behind them. */
  :root {
    color-scheme: dark;

    --bg:       #1b2820;
    --ink:      #f7fbec;
    --dim:      #c3e0c5;
    --faint:    #93b89d;
    --deep:     #62ad7e;
    --on:       #56e68b;
    --bright:   #cdfbd5;
    --line:     rgba(0,0,0,.72);
    --line-lit: rgba(0,0,0,.85);
    --lit-in:   inset 0 0 22px rgba(86,230,139,.09), inset 0 0 1px rgba(86,230,139,.5);
    --lit-in-s: inset 0 0 11px rgba(86,230,139,.12), inset 0 0 1px rgba(86,230,139,.5);
    --panel:    rgba(37,57,44,.92);
    --warn:     #d9af5e;

    --display: "Sitka Text", "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --ui: "Corbel", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { background: linear-gradient(180deg, #27382c 0%, var(--bg) 50%, #17221c 100%) fixed var(--bg); }
  body {
    margin: 0; color: var(--ink);
    font: 13px/1.5 var(--ui);
    display: flex; justify-content: center; padding: 20px 20px 22px;
    -webkit-font-smoothing: antialiased;
    scrollbar-width: thin; scrollbar-color: rgba(53,193,101,.22) transparent;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(53,193,101,.18); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(53,193,101,.3); }

  #rain {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #rain.on { opacity: .20; }

  .app { position: relative; z-index: 1; width: 100%; max-width: 420px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }

  /* The Sator square, lit like the rain and sitting in its own pool of
     background, so it reads as the rain settling rather than a label on top. */
  .mark-wrap { position: relative; display: inline-block; padding: 7px 10px 8px 6px; }
  .mark-wrap::before {
    content: ""; position: absolute; inset: -6px -14px -10px -12px;
    background: radial-gradient(ellipse at 42% 50%,
                rgba(39,56,44,.85) 38%, rgba(39,56,44,.45) 64%, transparent 82%);
    pointer-events: none;
  }
  .sq {
    position: relative; display: grid; grid-template-columns: repeat(5, 15px); gap: 3px;
    font-family: var(--display); font-weight: 600; font-size: 12.5px;
    line-height: 1.35; user-select: none; cursor: pointer;
  }
  .sq span { text-align: center; color: var(--deep); transition: color .18s, text-shadow .18s; }
  .sq span.mirror { color: #79c493; }
  .sq span.hi { color: var(--bright); text-shadow: 0 0 9px rgba(53,193,101,.75), 0 0 22px rgba(53,193,101,.35); }
  .sq:hover span { color: #4b8d62; }
  .sq:hover span.mirror { color: #5aa575; }
  .sq:hover span.hi { color: #c8fbd1; text-shadow: 0 0 12px rgba(53,193,101,.95), 0 0 28px rgba(53,193,101,.5); }
  .who {
    position: relative; margin-top: 9px; font-size: 10.5px; color: var(--faint);
    letter-spacing: .16em; text-transform: uppercase;
  }

  .lang { display: flex; gap: 2px; }
  .lang button {
    background: none; border: 1px solid transparent; color: var(--faint); cursor: pointer;
    font-family: var(--ui); font-size: 11px; letter-spacing: .1em; padding: 3px 7px; border-radius: 4px;
  }
  .lang button:hover { color: var(--dim); }
  .lang button[aria-pressed="true"] { color: var(--bright); border-color: var(--line-lit); }

  /* A ring rather than a filled disc, so the rain passes behind it. */
  .dial { text-align: center; padding: 10px 0 20px; }
  .power {
    width: 132px; height: 132px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: rgba(37,57,44,.7); color: var(--dim);
    font-family: var(--ui); font-size: 17px; letter-spacing: .05em;
    display: inline-flex; align-items: center; justify-content: center;
    transition: box-shadow .3s, border-color .3s, color .3s, transform .1s;
  }
  .power:hover { border-color: var(--line-lit); color: var(--ink); }
  .power:active { transform: scale(.985); }
  .power[disabled] { cursor: default; }
  .power.on {
    color: var(--bright); border-color: rgba(86,230,139,.8);
    text-shadow: 0 0 12px rgba(86,230,139,.5);
    box-shadow: 0 0 0 7px rgba(86,230,139,.08), 0 0 48px rgba(86,230,139,.24),
                inset 0 0 34px rgba(86,230,139,.10);
  }

  .state { margin-top: 17px; font-family: var(--display); font-size: 16px; color: var(--dim); }
  .state.on { color: var(--on); }
  .state.busy { color: var(--warn); }
  .sub {
    margin-top: 6px; font-size: 12px; line-height: 1.55; color: var(--faint);
    min-height: 18px; max-width: 300px; margin-left: auto; margin-right: auto;
  }

  .alert {
    margin: 0 0 16px; padding: 11px 13px; border-radius: 6px; font-size: 11.5px; line-height: 1.55;
    background: rgba(217,97,70,.08); border: 1px solid rgba(217,97,70,.28); color: #e29d87;
  }
  .alert.hint { background: rgba(217,175,94,.07); border-color: rgba(217,175,94,.24); color: #cfad73; }

  /* Yellow, so it is the one thing on a green screen that asks for attention. */
  .banner {
    margin: 0 0 16px; padding: 12px 13px; border-radius: 6px;
    background: rgba(242,198,72,.14); border: 1px solid rgba(242,198,72,.6);
    box-shadow: 0 0 22px rgba(242,198,72,.12), inset 0 0 18px rgba(242,198,72,.06);
    display: flex; align-items: center; gap: 12px;
  }
  .banner div { flex: 1; font-size: 11.5px; color: #f0dfac; }
  .banner div b {
    display: block; color: #ffd655; font-family: var(--display);
    font-size: 14px; font-weight: 600; margin-bottom: 2px;
  }
  .banner button {
    flex: none; background: #f2c648; border: 1px solid #f2c648;
    color: #1d230f; border-radius: 5px; padding: 8px 15px; font-weight: 700;
    font-family: var(--ui); font-size: 12px; letter-spacing: .06em; cursor: pointer;
  }
  .banner button:hover { background: #ffd655; }
  .banner button[disabled] { opacity: .55; cursor: default; }

  /* Hairline panels rather than filled boxes: barely there, so the background
     stays the background. */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; box-shadow: var(--lit-in);
  }
  .card + .card { margin-top: 9px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 13px;
  }
  .row + .row { border-top: 1px solid rgba(0,0,0,.28); }
  .row label { color: var(--dim); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }

  select, .linkinput {
    background: rgba(22,35,28,.85); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 8px; box-shadow: var(--lit-in-s);
    font-family: var(--ui); font-size: 11.5px; letter-spacing: .04em; max-width: 64%;
  }
  select:hover, .linkinput:focus {
    outline: none; box-shadow: inset 0 0 13px rgba(53,193,101,.14), inset 0 0 1px rgba(53,193,101,.6);
  }
  .linkinput { width: 100%; max-width: none; margin-top: 8px; }

  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch i {
    position: absolute; inset: 0; border-radius: 20px;
    background: rgba(22,35,28,.85); border: 1px solid var(--line);
    box-shadow: var(--lit-in-s);
    transition: background .18s, box-shadow .18s; pointer-events: none;
  }
  .switch i::after {
    content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--faint); top: 3px; left: 3px;
    transition: transform .18s, background .18s, box-shadow .18s;
  }
  .switch input:checked + i {
    background: rgba(53,193,101,.14);
    box-shadow: inset 0 0 12px rgba(53,193,101,.22), inset 0 0 1px rgba(53,193,101,.6);
  }
  .switch input:checked + i::after {
    transform: translateX(16px); background: var(--on); box-shadow: 0 0 8px rgba(53,193,101,.6);
  }

  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    border-radius: 5px; padding: 9px; box-shadow: var(--lit-in-s);
    font-family: var(--ui); font-size: 11.5px; letter-spacing: .08em; cursor: pointer;
  }
  .actions button:hover { color: var(--ink); border-color: var(--line-lit); }

  /* The story fills the window. It is a page to read, not a box sitting on one. */
  #about {
    position: fixed; inset: 0; z-index: 3; overflow: auto;
    background: linear-gradient(180deg, rgba(10,15,11,.97), rgba(6,11,7,.99));
    padding: 26px 26px 22px;
  }
  #about .inner { max-width: 400px; margin: 0 auto; }
  #about figure { margin: 0 0 18px; text-align: center; }
  #about figure img {
    width: 100%; max-width: 250px; height: auto; display: inline-block; border-radius: 3px;
    filter: grayscale(.5) brightness(.72) sepia(.18) hue-rotate(72deg) contrast(1.08);
  }
  #about figcaption { margin-top: 8px; font-size: 9.5px; letter-spacing: .06em; color: var(--faint); }
  #about h2 {
    margin: 0 0 10px; font-family: var(--display); font-size: 19px; font-weight: 600;
    color: var(--bright); letter-spacing: .02em; text-shadow: 0 0 14px rgba(53,193,101,.28);
  }
  #about h3 {
    margin: 20px 0 6px; font-family: var(--display); font-size: 14px; font-weight: 600;
    color: var(--ink); letter-spacing: .01em;
  }
  #about p { margin: 0; font-family: var(--display); font-size: 13px; line-height: 1.68; color: var(--dim); }
  #about .rule { height: 1px; background: rgba(53,193,101,.14); margin: 20px 0 0; }
  #about .back {
    margin-top: 18px; width: 100%; background: rgba(7,16,10,.5); border: 1px solid var(--line);
    box-shadow: var(--lit-in-s);
    color: var(--dim); border-radius: 5px; padding: 9px;
    font-family: var(--ui); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  }
  #about .back:hover { color: var(--bright); border-color: var(--line-lit); }

  footer { margin-top: 14px; text-align: center; }
  footer .ver { display: block; color: var(--faint); font-size: 10.5px; letter-spacing: .09em; }

  /* ---- THEME: Moss on stone (approved 1 Oct 2026) ----
     Soft clay: everything is one material, lit from the top left. Raised =
     off, the same disc pressed into a faint rim = connected. Manrope is
     embedded below so the app looks the same offline. Everything above
     this block is the previous dark theme, overridden here rule by rule. */

*{-webkit-font-smoothing:antialiased}
:root{color-scheme:light;--bg:#e9e2d3;--ink:#36322b;--dim:#6c675e;--faint:#8c867c;--deep:#c1bbaf;--on:#4f7554;--bright:#4f7554;--ui:'Manrope',sans-serif;--display:'Manrope',sans-serif;--panel:#e9e2d3;--line:transparent;--line-lit:transparent;--lit-in:none;--lit-in-s:none}
html,body{background:#e9e2d3}
body{padding:16px 20px 14px}
header{margin-bottom:6px}
.who{margin-top:6px}
.card{border:none;border-radius:22px;box-shadow:7px 7px 16px #c6c0b3,-7px -7px 16px #faf4ea}
.card+.card{margin-top:14px}
.row{padding:12px 18px}
.row+.row{border-top:1px solid rgba(198,192,179,0.35)!important}
.row label{text-transform:none;letter-spacing:0;font-size:14.5px;font-weight:700;color:#36322b}
.dial{padding:6px 0 16px}
.power{width:184px;height:184px;border:none;background:#e9e2d3;box-shadow:12px 12px 26px #c6c0b3,-12px -12px 26px #faf4ea;font-weight:800;font-size:18px;letter-spacing:.01em;color:#8c867c}
.power.on{box-shadow:inset 10px 10px 22px #c6c0b3,inset -10px -10px 22px #faf4ea,0 0 0 3px rgba(79,117,84,0.0);color:#4f7554;text-shadow:none;border:none}
.state{font-weight:800;font-size:19px;margin-top:16px}.state.on{color:#4f7554}
.sub{color:#6c675e}
.sq{font-family:'Manrope';font-weight:800}.sq span{color:#c1bbaf;text-shadow:1px 1px 0 #faf4ea}.sq span.hi{color:#4f7554;text-shadow:1px 1px 0 #faf4ea}.sq span.mirror{color:#aaa49a}
.mark-wrap::before{background:none}
select{-webkit-appearance:none;appearance:none;padding:8px 34px 8px 14px!important;cursor:pointer;background-color:#e9e2d3!important;border:none!important;border-radius:12px!important;color:#36322b!important;font-weight:700;box-shadow:inset 3px 3px 6px #c6c0b3,inset -3px -3px 6px #faf4ea!important;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%)!important;background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%!important;background-size:5px 5px,5px 5px!important;background-repeat:no-repeat!important}
.switch{width:52px;height:30px}.switch i{border-radius:30px;background:#e9e2d3!important;border:none!important;box-shadow:inset 3px 3px 6px #c6c0b3,inset -3px -3px 6px #faf4ea!important}
.switch i::after{width:24px;height:24px;top:3px;left:3px;background:#e9e2d3!important;box-shadow:2px 2px 5px #c6c0b3,-2px -2px 5px #faf4ea!important}
.switch input:checked+i::after{transform:translateX(22px);background:#4f7554!important}
.lang button{color:#8c867c;font-weight:800;border-radius:10px;padding:5px 11px}.lang button[aria-pressed=true]{color:#4f7554;box-shadow:inset 2px 2px 5px #c6c0b3,inset -2px -2px 5px #faf4ea;border-color:transparent}
footer{margin-top:12px} footer .ver{color:#8c867c}
#rain.on{opacity:.85}
.power{transition:box-shadow .25s ease,background .25s ease,transform .1s}
.power.on{box-shadow:3px 3px 8px #c6c0b3,-3px -3px 8px #faf4ea,inset 11px 11px 24px #c6c0b3,inset -11px -11px 24px #faf4ea;color:#4f7554}
.state.busy{color:#9a691b}
.lang button:hover{color:#36322b}
.sq:hover span{color:#979288}.sq:hover span.mirror{color:#837f77}.sq:hover span.hi{color:#416145;text-shadow:1px 1px 0 #faf4ea}
::-webkit-scrollbar-thumb{background:rgba(198,192,179,0.6)} ::-webkit-scrollbar-thumb:hover{background:#c6c0b3}
body{scrollbar-color:rgba(198,192,179,0.7) transparent}
.alert{background:#e9e2d3;border:none;border-radius:14px;color:#8a3a28;box-shadow:inset 3px 3px 6px #c6c0b3,inset -3px -3px 6px #faf4ea}
.alert.hint{color:#7a591b}
/* The update notice stays yellow so it is the one thing that asks to be noticed. */
.banner{background:#f3d473;border:none;border-radius:16px;box-shadow:6px 6px 14px #c6c0b3,-6px -6px 14px #faf4ea}
.banner div{color:#4a3b13} .banner div b{color:#2f250f;font-family:var(--ui);font-weight:800}
.banner button{background:#e9e2d3;border:none;color:#36322b;font-weight:800;border-radius:12px;padding:9px 16px;box-shadow:3px 3px 8px rgba(120,94,19,.35),-3px -3px 8px rgba(255,244,208,.7)}
.banner button:hover{background:#f0e9dc}
.linkinput{background:#e9e2d3!important;border:none!important;border-radius:12px!important;color:#36322b!important;padding:11px 14px!important;box-shadow:inset 3px 3px 6px #c6c0b3,inset -3px -3px 6px #faf4ea!important}
.actions button{background:#e9e2d3;border:none;border-radius:14px;color:#36322b;font-weight:700;padding:11px;box-shadow:6px 6px 14px #c6c0b3,-6px -6px 14px #faf4ea}
.actions button:hover{color:#4f7554;border-color:transparent}
.actions button:active{box-shadow:inset 3px 3px 6px #c6c0b3,inset -3px -3px 6px #faf4ea}
#about{background:#e9e2d3}
#about figure img{filter:saturate(.85) contrast(1.02);border-radius:14px;box-shadow:6px 6px 14px #c6c0b3,-6px -6px 14px #faf4ea}
#about h2{color:#4f7554;text-shadow:none;font-family:var(--ui);font-weight:800}
#about h3{color:#36322b;font-family:var(--ui);font-weight:800}
#about p{color:#635f55;font-family:var(--ui)}
#about .rule{background:rgba(198,192,179,0.6)}
#about .back{background:#e9e2d3;border:none;border-radius:14px;color:#36322b;font-weight:800;box-shadow:6px 6px 14px #c6c0b3,-6px -6px 14px #faf4ea}
#about .back:hover{color:#4f7554;border-color:transparent}


/* When something extra is showing (the update notice, an error, the Mac quit
   button) the page tightens a little so it still fits the window unscrolled. */
.app:has(#updateBanner:not([hidden])) .power,.app:has(#alert:not([hidden])) .power,.app:has(#quitRow:not([hidden])) .power{width:152px;height:152px;font-size:16px}
.app:has(#updateBanner:not([hidden])) .dial,.app:has(#alert:not([hidden])) .dial,.app:has(#quitRow:not([hidden])) .dial{padding:0 0 10px}
.app:has(#updateBanner:not([hidden])) .state,.app:has(#alert:not([hidden])) .state,.app:has(#quitRow:not([hidden])) .state{margin-top:10px}
.app:has(#updateBanner:not([hidden])) .row,.app:has(#alert:not([hidden])) .row,.app:has(#quitRow:not([hidden])) .row{padding:9px 18px}

  /* ---- 1.2.10 (1 Oct 2026) ----
     The button reads the other way round: switched on it stands up out of the
     clay, switched off it is pressed in. RU and EN are larger. The update
     screen and the "updated" note belong to the same material. */
  .power{box-shadow:3px 3px 8px #c6c0b3,-3px -3px 8px #faf4ea,inset 11px 11px 24px #c6c0b3,inset -11px -11px 24px #faf4ea;color:#8c867c}
  .power.on{box-shadow:12px 12px 26px #c6c0b3,-12px -12px 26px #faf4ea;color:#4f7554}
  .lang{gap:5px}
  .lang button{font-size:13.5px;padding:7px 13px;letter-spacing:.08em}
  .banner.done{background:#dde3ce;box-shadow:inset 3px 3px 6px #c6c0b3,inset -3px -3px 6px #faf4ea}
  .banner.done div{color:#4b5948} .banner.done div b{color:#3d6042}
  #updating{position:fixed;inset:0;z-index:5;background:#e9e2d3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px;font-family:var(--ui)}
  #updating i{width:76px;height:76px;border-radius:50%;margin-bottom:26px;
    box-shadow:8px 8px 18px #c6c0b3,-8px -8px 18px #faf4ea;animation:arepoBreathe 1.6s ease-in-out infinite alternate}
  #updating b{font-weight:800;font-size:19px;color:#36322b}
  #updating span{margin-top:8px;max-width:290px;font-size:13px;line-height:1.55;color:#6e695f}
  @keyframes arepoBreathe{
    from{box-shadow:8px 8px 18px #c6c0b3,-8px -8px 18px #faf4ea}
    to{box-shadow:2px 2px 5px #c6c0b3,-2px -2px 5px #faf4ea,inset 6px 6px 14px #c6c0b3,inset -6px -6px 14px #faf4ea}}

  /* ---- THEME: Portland stone (approved 1 Oct 2026) ----
     The whole window is one block of warm Portland stone. The texture runs
     continuously through every surface (background-attachment: fixed), so
     each control is the same stone lifted or pressed. No green anywhere:
     on and selected are the deepest, darkest cut. Switches are a stone ball
     rolling along a carved channel that darkens where it has worn. Forum is
     embedded so the lettering renders offline. */

Noise' baseFrequency='.011' numOctaves='3' seed='5' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 1.0000 0 0 0 0 0.9647 0 0 0 0 0.8796 0.522 0 0 0 -0.20879999999999999'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.05' numOctaves='2' seed='23' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4780 0 0 0 0 0.3631 0 0 0 0 0.2220 9 0 0 0 -7.55'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), linear-gradient(160deg,#e9e2d0,#e3dbc7 45%,#dad2bf)!important;background-attachment:scroll,fixed!important}
/* A: the notice that needs you stands up out of the stone and slowly breathes */
#updateBanner:not(.done){box-shadow:5px 5px 12px #c1baa8,-5px -5px 12px #f8f3e7;animation:arepoLift 2.6s ease-in-out infinite alternate}
@keyframes arepoLift{from{box-shadow:5px 5px 12px #c1baa8,-5px -5px 12px #f8f3e7;transform:translateY(0)}to{box-shadow:9px 9px 20px #c1baa8,-9px -9px 20px #f8f3e7;transform:translateY(-1px)}}
.banner.done{box-shadow:inset 3px 3px 6px #c1baa8,inset -3px -3px 6px #f8f3e7}
#alert.alert:not(.hint){box-shadow:inset 6px 7px 13px #c1baa8,inset -4px -4px 8px #f8f3e7}
.alert.hint{box-shadow:inset 3px 3px 6px #c1baa8,inset -3px -3px 6px #f8f3e7}
.power[disabled]{animation:arepoPress 1.3s ease-in-out infinite alternate}
@keyframes arepoPress{from{box-shadow:3px 3px 8px #c1baa8,-3px -3px 8px #f8f3e7,inset 11px 11px 24px #c1baa8,inset -11px -11px 24px #f8f3e7}
  to{box-shadow:12px 12px 26px #c1baa8,-12px -12px 26px #f8f3e7}}


  /* The story page (1 Oct 2026): closes from a circled X that stays at the top
     right while reading, no rule above the close button, and the close button
     cut into the stone instead of raised. */
  #about .rule{display:none}
  #about .back{box-shadow:inset 3px 3px 7px #c1baa8,inset -3px -3px 7px #f8f3e7!important;margin-top:24px}
  #about .back:hover{box-shadow:inset 4px 4px 9px #b9b2a1,inset -3px -3px 7px #f8f3e7!important}
  #about .inner{padding-top:8px}
  /* Off: pressed in, with no light spilling out past the top left of the rim
     (Elijah, 1 Oct 2026: it distracted from the raised "on" state). The inner
     shading and the shadow outside the bottom right stay. */
  .power{box-shadow:3px 3px 8px #c1baa8,inset 11px 11px 24px #c1baa8,inset -11px -11px 24px #f8f3e7}
  @keyframes arepoPress{from{box-shadow:3px 3px 8px #c1baa8,inset 11px 11px 24px #c1baa8,inset -11px -11px 24px #f8f3e7}
    to{box-shadow:12px 12px 26px #c1baa8,-12px -12px 26px #f8f3e7}}

  /* The window's own title bar, in the same stone (1.2.11 and later, inside
     AREPO's window only: see the bindings check in the script). The strip is
     where the window is dragged from; the two divots minimise and close. */
  #titlebar{position:fixed;top:0;left:0;right:0;height:50px;z-index:6;display:flex;justify-content:flex-end;
    align-items:center;gap:12px;padding:0 14px;cursor:default;user-select:none}
  #titlebar button{width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;
    background:center/17px 17px no-repeat;box-shadow:inset 3px 3px 6px #c1baa8,inset -3px -3px 6px #f8f3e7;
    filter:drop-shadow(0 1px 0 rgba(255,251,241,.6))}
  #titlebar button:hover{box-shadow:inset 3px 3px 7px #b9b2a1,inset -2px -2px 5px #f8f3e7}
  #tbMin{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f4539' stroke-width='2.1' stroke-linecap='round'><path d='M6 12h12'/></svg>")!important}
  #tbClose{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f4539' stroke-width='2.1' stroke-linecap='round'><path d='M7 7l10 10M17 7L7 17'/></svg>")!important}
  html.framed body{padding-top:66px}
  html.framed #about{padding-top:64px}
  /* the window's edge, now that Windows no longer draws one */
  html.framed::after{content:"";position:fixed;inset:0;border:1px solid #c9c2b0;pointer-events:none;z-index:7}

  /* ---- CARVING: cut walls (approved 1 Oct 2026) ----
     Real carving is shadow inside the cut, which text-shadow cannot paint, so
     each word goes through an SVG filter: the floor of the cut in shade, the
     upper-left wall dark, the lower-right wall lit, and a lit lip outside. */
  #power .lbl,.state,.sq span,#about h2,#about h3,.banner div b,#updating b{color:#000000!important;text-shadow:none!important;filter:url(#cutB)}
  .sub,footer .ver,.row label,.lang .lbl,#about p,#about figcaption,.banner div span,#updating span{color:#000000!important;text-shadow:none!important;filter:url(#cutS)}
  /* lighter cuts for what is not chosen; the AREPO row cut deepest */
  #power:not(.on) .lbl{filter:url(#cutBL)}
  .lang button:not([aria-pressed=true]) .lbl{filter:url(#cutSL)}
  .sq span.mirror{filter:url(#cutB) brightness(1.08)}
  .sq span.hi{filter:url(#cutB) brightness(.72)}
  .power .lbl{display:inline-block}
  /* the small print, larger now that it is cut rather than printed */
  .sub{font-size:14px!important}
  footer .ver{font-size:12.5px!important;letter-spacing:.08em!important}
  /* A bigger button (1 Oct 2026): "ПОДКЛЮЧЕНО" sat too close to the rim. */
  .power{width:212px!important;height:212px!important;letter-spacing:.13em!important}
  .app:has(#updateBanner:not([hidden])) .power,.app:has(#alert:not([hidden])) .power,.app:has(#quitRow:not([hidden])) .power{width:176px!important;height:176px!important;font-size:18px!important}
  /* with a notice showing, the stone bar gives back some of its gap */
  html.framed body:has(#updateBanner:not([hidden])),html.framed body:has(#alert:not([hidden])){padding-top:52px}
  /* Room for the bigger button: the status note on one line, the square a
     touch tighter, slightly slimmer rows, and the compact button whenever a
     notice or the server picker is showing. */
  .sub{max-width:390px!important}
  .sq{line-height:1.2!important}
  html.framed body{padding-top:60px}
  .row{padding-top:10px!important;padding-bottom:10px!important}
  footer{margin-top:8px!important}
  .banner{padding-top:9px!important;padding-bottom:9px!important}
  .app:has(.card:not([hidden]) #entry) .power{width:176px!important;height:176px!important;font-size:18px!important}
  .app:has(#updateBanner:not([hidden])) header{margin-bottom:2px!important}
  .app:has(#updateBanner:not([hidden])) .dial{padding-bottom:3px!important}
  .app:has(#updateBanner:not([hidden])) .state{margin-top:5px!important}
  .app:has(#updateBanner:not([hidden])) #main .card+.card{margin-top:10px!important}
  /* The story page closes from a small key like RU and EN (1 Oct 2026): sized
     to its word, pressed into the stone, and the word stays the same colour. */
  #about .back{display:block;width:auto!important;margin:28px auto 6px!important;padding:8px 20px!important;border-radius:10px!important;
    font-family:Forum,serif!important;font-size:15px!important;letter-spacing:.12em!important;
    box-shadow:inset 2px 2px 5px #c1baa8,inset -2px -2px 5px #f8f3e7!important;text-shadow:none!important}
  #about .back .lbl{color:#000000!important;text-shadow:none!important;filter:url(#cutS);display:inline-block}
  #about .back:hover,#about .back:active{color:#000000!important;box-shadow:inset 3px 3px 6px #b9b2a1,inset -2px -2px 5px #f8f3e7!important}
  /* The title bar marks are bare carved strokes, bigger and easy to read, with
     no circle or texture round them (1 Oct 2026). The bar is slimmer again, so
     the square sits back where it was. */
  #titlebar{height:40px!important;gap:4px!important;padding:0 6px!important}
  #titlebar button{width:44px!important;height:36px!important;border-radius:8px!important;box-shadow:none!important;
    background-size:22px 22px!important;filter:drop-shadow(0 1px 0 rgba(255,251,241,.85)) drop-shadow(0 -1px .5px rgba(40,27,14,.35))!important;opacity:.82}
  #titlebar button:hover{box-shadow:none!important;opacity:1}
  html.framed body{padding-top:40px!important}
  html.framed body:has(#updateBanner:not([hidden])),html.framed body:has(#alert:not([hidden])){padding-top:36px!important}
  html.framed #about{padding-top:48px!important}
  html.framed .lang{margin-top:6px}

  /* The title bar marks are carved exactly like the words: the same filter on
     the strokes themselves, no picture behind them, no change on hover. */
  #titlebar button,#titlebar button:hover{background-image:none!important;filter:none!important;opacity:1!important;box-shadow:none!important}
  #titlebar button svg{display:block;margin:auto;filter:url(#cutS)}
  #titlebar button:active svg{transform:translateY(1px)}
  html.framed::after{border-radius:16px}
  /* no separate pulse while connecting: the button is already on its way up */

  /* ---- FLOAT: spins once, then drifts (approved 2 Oct 2026) ----
     Connected, the button keeps exactly the inside it has when off. It floats by
     what happens outside it: a cast shadow and a white light, placed by --la
     (where the light is) and scaled by --lift (0 pressed in, 1 afloat). On
     connecting --lift runs to 1 while the light travels once round the button,
     then the button drifts gently. No !important on transform or box-shadow:
     an important declaration outranks an animation and would freeze it. */
  @property --la{syntax:'<angle>';inherits:false;initial-value:225deg}
  @property --lift{syntax:'<number>';inherits:false;initial-value:0}
  /* Deep tilt, slow spin, light that grows with the wind-up (picked 2 Oct 2026).
     --tilt leans the disc, in perspective, towards wherever the light is, so it
     rolls round once like a coin settling. --glow scales the white light outside
     the disc: it starts at nothing and is full a third of the way through the
     turn. The lift and the drift sit in `translate` and `scale`, which leaves
     `transform` to the tilt alone. The tilt is a keyframe (floatLean), not a
     standing transform: a perspective transform makes the browser draw the
     button as a picture and stretch it, which left the word soft at rest. */
  @property --tilt{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --glow{syntax:'<number>';inherits:false;initial-value:1}
  #main .power{--lift:0;--tilt:0deg;--glow:1;translate:0 0;scale:1;
    box-shadow:calc((-4.2px - 23px * var(--lift)) * cos(var(--la))) calc((-4.2px - 23px * var(--lift)) * sin(var(--la))) calc(8px + 26px * var(--lift)) rgba(70,51,32,.26),
      calc(-9px * var(--lift) * cos(var(--la))) calc(-9px * var(--lift) * sin(var(--la))) calc(12px * var(--lift)) rgba(70,51,32,.16),
      0 0 calc(24px * var(--lift) * var(--glow)) calc(6px * var(--lift) * var(--glow)) rgba(255,251,241,.55),
      calc(12px * var(--lift) * var(--glow) * cos(var(--la))) calc(12px * var(--lift) * var(--glow) * sin(var(--la))) calc(24px * var(--lift) * var(--glow)) #f8f3e7,
      inset 11px 11px 24px #c1baa8,inset -11px -11px 24px #f8f3e7;
    transition:translate .9s cubic-bezier(.22,.8,.25,1),scale .9s cubic-bezier(.22,.8,.25,1),--lift .9s cubic-bezier(.22,.8,.25,1),color .4s,
      width .5s cubic-bezier(.3,.7,.2,1),height .5s cubic-bezier(.3,.7,.2,1),font-size .5s cubic-bezier(.3,.7,.2,1)}
  #main .power.on{--lift:1;translate:-2px -4px;scale:1.03;
    animation:floatOrbit 3.4s cubic-bezier(.3,.6,.2,1) 1,floatTilt 3.4s cubic-bezier(.3,.6,.2,1) 1,floatLean 3.4s linear 1,floatGlow 3.4s linear 1,floatBob 4.2s ease-in-out .9s infinite}
  .power[disabled]:not(.on){animation:none!important}
  @keyframes floatOrbit{from{--la:585deg}to{--la:225deg}}
  @keyframes floatTilt{0%{--tilt:0deg}30%{--tilt:22deg}100%{--tilt:0deg}}
  @keyframes floatLean{from,to{transform:perspective(620px) rotateX(calc(sin(var(--la)) * var(--tilt))) rotateY(calc(cos(var(--la)) * var(--tilt) * -1))}}
  @keyframes floatGlow{0%{--glow:0}10%{--glow:.42}20%{--glow:.74}32%{--glow:1}100%{--glow:1}}
  @keyframes floatBob{0%,100%{translate:-2px -4px}50%{translate:-1px -7px}}

  /* ---- TEXT: slow and scattered (approved 2 Oct 2026) ----
     When wording changes, each letter of the old wording fades at its own moment
     and the new letters arrive the same way. The carving filter sits on the line,
     so it carves whatever letters are showing. */
  .ch{opacity:1;transition:opacity .45s ease}
  .ch.out{opacity:0}
  @media (prefers-reduced-motion:reduce){#main .power.on{animation:none}.ch{transition:none}}

  /* The story page's photograph, caption and close key fade with its words. */
  #about figure,#about .back{opacity:0;transition:opacity .45s ease}
  #about.in figure,#about.in .back{opacity:1;transition-delay:.12s}
  @media (prefers-reduced-motion:reduce){#about figure,#about .back{opacity:1;transition:none}}
  /* The story page fades in over the main screen and fades away to reveal it. */
  #about{opacity:0;transition:opacity .35s ease}
  #about.shown{opacity:1}
  @media (prefers-reduced-motion:reduce){#about{transition:none}}
  /* A notice and an error showing together: a smaller button, so the page still fits. */
  .app:has(#updateBanner:not([hidden])):has(#alert:not([hidden])) .power{width:142px!important;height:142px!important;font-size:16px!important}
  .app:has(#updateBanner:not([hidden])):has(#alert:not([hidden])) .alert{margin-bottom:10px!important}
  #about{cursor:pointer}

  /* ---- RU / EN: ONE HOLLOW THAT SLIDES (3 Oct 2026) ----
     The pressed key is a single hollow behind the two words, carried across to
     the other one rather than jumping. --pl and --pr are its left and right
     edges, measured from the words by the script. */
  .lang{position:relative}
  .lang::before{content:"";position:absolute;top:0;bottom:0;left:var(--pl,0px);right:var(--pr,0px);border-radius:10px;
    box-shadow:inset 3px 3px 6px #c1baa8,inset -3px -3px 6px #f8f3e7;pointer-events:none;display:none;
    transition:left .46s cubic-bezier(.4,0,.2,1),right .46s cubic-bezier(.4,0,.2,1)}
  html[data-pill] .lang::before{display:block}
  html[data-pill] .lang button{position:relative;z-index:1}
  html[data-pill] .lang button[aria-pressed=true]{background:none!important;box-shadow:none!important}
  html[data-pill] .lang button .lbl{filter:url(#cutSL)!important}
  html[data-pill] .lang button.lit .lbl{filter:url(#cutS)!important}
  .lang.still::before{transition:none!important}

  /* ---- THE POINTER: A SMALL CARVED RING (3 Oct 2026) ----
     Instead of the arrow, a ring cut into the stone that follows the hand. It
     stays one size and looks the same everywhere. */
  #cur{position:fixed;left:0;top:0;width:0;height:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s}
  #cur.show{opacity:1}
  #cur .ring{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    box-shadow:inset 1.6px 1.6px 2.4px rgba(96,83,64,.62),inset -1.2px -1.2px 1.6px rgba(255,251,241,.95)}
  .cur-on,.cur-on *{cursor:none!important}

  /* ---- THE "AREPO HAS UPDATED" NOTE LEAVES WHEN THE APP IS TOUCHED ----
     It fades, then the room it took closes up while the button grows back to
     full size, so nothing on the screen jumps. */
  .banner{transition:opacity .35s ease}
  .banner.leaving{opacity:0}
  .note-gap{transition:height .5s cubic-bezier(.3,.7,.2,1)}
  header{transition:margin-bottom .5s cubic-bezier(.3,.7,.2,1)}
  body{transition:padding-top .5s cubic-bezier(.3,.7,.2,1)}
  .dial{transition:padding-bottom .5s cubic-bezier(.3,.7,.2,1)}
  .state{transition:margin-top .5s cubic-bezier(.3,.7,.2,1)}
  .row{transition:padding .5s cubic-bezier(.3,.7,.2,1)}
  #main .card+.card{transition:margin-top .5s cubic-bezier(.3,.7,.2,1)}
  @media (prefers-reduced-motion:reduce){.banner,.note-gap,header,body,.dial,.state,.row,#main .card+.card{transition:none}}
</style>

const ROWS = ["SATOR", "AREPO", "TENET", "OPERA", "ROTAS"];
let lang = "ru";
let last = null;
let aboutOpen = false;
// What this page was loaded as. A look-only update changes uiRev and an
// update of the app changes version; either way the page reloads itself.
let loadedRev = null, loadedVersion = null, updating = false;

const $ = (id) => document.getElementById(id);
const t = (k) => (T[lang] && T[lang][k]) || T.en[k] || k;

/* The rain runs only while the tunnel is up, and stops completely when it is
   not: this runs on family laptops that are not new, and a canvas animating
   behind an idle window is a rude thing to leave running. */
const cv = $("rain"), cx = cv.getContext("2d");
let cols = 0, drops = [], colWord = [], rainTimer = null;

// The background letters are the square's own unlit grey with the same thin
// white edge, so they read as pressed into the clay. Only some columns run, and
// they fade to transparent: painting the background colour over them instead
// drifted the clay towards pink.
// More often since 1 Oct 2026 (Elijah: "one streak, then a few seconds"): more
// columns, a shorter rest between streaks, and resting columns can start too.
const RAIN_STEP = 22, RAIN_DENSITY = 0.72, RAIN_FADE = "rgba(0,0,0,0.10)";
const RAIN_RESTART = 0.10, RAIN_WAKE = 0.009;
const RAIN_INK = "#c1b7a5", RAIN_EDGE = "#f7f1e5", RAIN_FONT = "15px Forum, serif";
let colOn = [], rainTick = 0;

function sizeRain() {
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  cols = Math.floor(cv.width / RAIN_STEP);
  drops = new Array(cols).fill(0).map(() => Math.floor(Math.random() * -18));
  // Each column falls as one of the five words, repeating, so a stream read
  // downwards actually spells SATOR or AREPO rather than being noise.
  colWord = new Array(cols).fill(0).map(() => ROWS[Math.floor(Math.random() * ROWS.length)]);
  colOn = new Array(cols).fill(0).map(() => Math.random() < RAIN_DENSITY);
}

function drawRain() {
  if ((rainTick++ % 2) !== 0) return;
  cx.globalCompositeOperation = "destination-out";
  cx.fillStyle = RAIN_FADE;
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.globalCompositeOperation = "source-over";
  cx.font = RAIN_FONT;
  cx.textAlign = "center";
  for (let i = 0; i < drops.length; i++) {
    if (!colOn[i]) {
      // A resting column now and then starts a stream of its own.
      if (Math.random() < RAIN_WAKE) { colOn[i] = true; drops[i] = 0; }
      continue;
    }
    const word = colWord[i], x = i * RAIN_STEP + RAIN_STEP / 2, y = drops[i] * RAIN_STEP;
    if (drops[i] >= 0) {
      const ch = word[drops[i] % word.length];
      cx.fillStyle = RAIN_EDGE; cx.fillText(ch, x + 1, y + 1);
      cx.fillStyle = RAIN_INK;  cx.fillText(ch, x, y);
    }
    if (y > cv.height && Math.random() < RAIN_RESTART) {
      drops[i] = 0;
      colWord[i] = ROWS[Math.floor(Math.random() * ROWS.length)];
      // Some streams rest after reaching the bottom, so the columns keep changing.
      colOn[i] = Math.random() < RAIN_DENSITY + 0.2;
    }
    drops[i]++;
  }
  clearAround(document.querySelector(".mark-wrap"), 26);
  clearAround(document.querySelector(".lang"), 22);
  clearAround(document.getElementById("tbMin"), 14);
  clearAround(document.getElementById("tbClose"), 14);
}

// Nothing falls behind the square or the language switch. The letters fade out
// as they come near, so they read as passing behind something rather than
// being cut off at the edge of a box.
function clearAround(el, fade) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  // An ellipse that still contains the corners of the box.
  const hx = r.width * 0.73, hy = r.height * 0.73, R = hy + fade;
  cx.save();
  cx.translate(r.left + r.width / 2, r.top + r.height / 2);
  cx.scale(hx / hy, 1);
  const g = cx.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(hy / R, "rgba(0,0,0,1)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  cx.globalCompositeOperation = "destination-out";
  cx.fillStyle = g;
  cx.fillRect(-R, -R, 2 * R, 2 * R);
  cx.restore();
  cx.globalCompositeOperation = "source-over";
}

function rain(on) {
  if (on && !rainTimer) {
    sizeRain();
    cv.classList.add("on");
    rainTimer = setInterval(drawRain, 45);
  } else if (!on && rainTimer) {
    clearInterval(rainTimer);
    rainTimer = null;
    cv.classList.remove("on");
    setTimeout(() => { if (!rainTimer) cx.clearRect(0, 0, cv.width, cv.height); }, 1300);
  }
}
window.addEventListener("resize", () => { if (rainTimer) sizeRain(); });

function drawMark() {
  const el = $("mark");
  ROWS.forEach((row, r) => {
    for (const ch of row) {
      const s = document.createElement("span");
      s.textContent = ch;
      if (r === 1) s.className = "hi";
      else if (r === 3) s.className = "mirror";
      el.appendChild(s);
    }
  });
}

// Wording changes letter by letter: the old letters fade out at scattered
// moments, then the new ones fade in the same way. The first paint, anything
// inside the story page and people who ask for reduced motion get the words at
// once. Each call supersedes the one before it on the same element.
const FADE_MS = 450, FADE_SPREAD = 450;   // halved on 2 Oct 2026
const fadeGen = new WeakMap(), fadeClear = new WeakMap();
let wordsReady = false;
const stillMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function setText(el, text) {
  if (!el || el.dataset.txt === text) return;
  el.dataset.txt = text;
  const gen = (fadeGen.get(el) || 0) + 1;
  fadeGen.set(el, gen);
  if (!wordsReady || stillMotion || el.closest("#about")) { el.textContent = text; return; }
  const old = [...el.querySelectorAll(".ch")];
  if (!old.length && el.textContent) {       // words set plainly before: letter them first
    const was = el.textContent; el.textContent = "";
    for (const ch of was) { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; el.appendChild(sp); old.push(sp); }
    void el.offsetWidth;
  }
  // Letters already on their way out keep their own timing; a change that
  // arrives mid-fade waits only for what is left of it, not a second full fade.
  const now = performance.now();
  let clearAt = now;
  for (const c of old) {
    if (c.classList.contains("out")) continue;
    const d = Math.random() * FADE_SPREAD;
    c.style.transitionDelay = d + "ms"; c.classList.add("out");
    clearAt = Math.max(clearAt, now + d + FADE_MS);
  }
  clearAt = Math.max(clearAt, fadeClear.get(el) || 0);
  fadeClear.set(el, clearAt);
  setTimeout(() => {
    if (fadeGen.get(el) !== gen) return;
    el.textContent = "";
    for (const ch of text) {
      const sp = document.createElement("span");
      sp.className = "ch out"; sp.textContent = ch; sp.style.transitionDelay = Math.random() * FADE_SPREAD + "ms";
      el.appendChild(sp);
    }
    void el.offsetWidth;
    el.querySelectorAll(".ch").forEach((c) => c.classList.remove("out"));
  }, old.length ? Math.max(0, clearAt - now) : 0);
}

// The pressed key of the language switch is one hollow that slides between RU and
// EN. It is measured from the words, so it fits whatever they are set in.
const langBox = document.querySelector(".lang");
let pillAt = null, pillGen = 0;
function placePill(animate) {
  const on = langBox.querySelector('button[aria-pressed="true"]');
  if (!on || !on.offsetWidth) return;
  let end = 0;
  langBox.querySelectorAll("button").forEach((x) => { end = Math.max(end, x.offsetLeft + x.offsetWidth); });
  const l = on.offsetLeft, r = end - l - on.offsetWidth;
  const moving = animate && pillAt !== null && pillAt !== l && !stillMotion;
  const gen = ++pillGen;
  document.documentElement.dataset.pill = "1";
  langBox.classList.toggle("still", !moving);
  langBox.style.setProperty("--pl", l + "px");
  langBox.style.setProperty("--pr", r + "px");
  pillAt = l;
  // the word deepens as the hollow reaches it, and the one left behind lightens
  const lit = () => langBox.querySelectorAll("button").forEach((b) => b.classList.toggle("lit", b === on));
  if (!moving) { lit(); void langBox.offsetWidth; langBox.classList.remove("still"); return; }
  setTimeout(() => { if (pillGen === gen) lit(); }, 230);
}
window.addEventListener("resize", () => placePill(false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placePill(false));

// The pointer is a small carved ring that follows the hand a moment behind it.
// Only with a real mouse, only while it is moving (nothing animates behind an
// idle window), and not for people who ask for reduced motion.
(function () {
  const fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (!fine || stillMotion) return;
  const zone = document.documentElement;
  const cur = document.createElement("div");
  cur.id = "cur"; cur.setAttribute("aria-hidden", "true");
  cur.innerHTML = '<span class="ring"></span>';
  document.body.appendChild(cur);
  const ring = cur.firstChild;
  let tx = 0, ty = 0, rx = 0, ry = 0, raf = 0, lastT = 0, seen = false;
  function frame(now) {
    const dt = Math.min(50, now - lastT); lastT = now;
    // with no dot under the hand the ring is what you aim with, so it keeps close
    const k = 1 - Math.exp(-dt / 60);
    rx += (tx - rx) * k; ry += (ty - ry) * k;
    ring.style.transform = "translate3d(" + rx.toFixed(2) + "px," + ry.toFixed(2) + "px,0)";
    raf = (Math.abs(tx - rx) + Math.abs(ty - ry) > 0.2) ? requestAnimationFrame(frame) : 0;
  }
  function hide() { cur.classList.remove("show"); zone.classList.remove("cur-on"); seen = false; }
  zone.addEventListener("pointermove", (e) => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    tx = e.clientX; ty = e.clientY;
    if (!seen) { seen = true; rx = tx; ry = ty; ring.style.transform = "translate3d(" + rx + "px," + ry + "px,0)"; }
    zone.classList.add("cur-on"); cur.classList.add("show");
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); }
  }, { passive: true });
  zone.addEventListener("pointerleave", hide);
  window.addEventListener("blur", hide);
})();

// The "AREPO has updated" note stays only until the app is touched: the first
// click or key press anywhere fades it out, then the space it took closes up.
// The app goes on saying "just updated" for three minutes, so the page remembers
// which version it has already been told about.
let seenUpdate = null, noteLeaving = false;
function updatedSeen(v) {
  if (seenUpdate === v) return true;
  try { return localStorage.getItem("arepoUpdatedSeen") === v; } catch (e) { return false; }
}
function dismissUpdated() {
  const banner = $("updateBanner");
  if (!last || noteLeaving || banner.hidden || !banner.classList.contains("done")) return;
  seenUpdate = last.version;
  try { localStorage.setItem("arepoUpdatedSeen", last.version); } catch (e) {}
  if (stillMotion) { paint(last); return; }
  noteLeaving = true;
  banner.classList.add("leaving");
  setTimeout(() => {
    const cs = getComputedStyle(banner);
    const gap = document.createElement("div");
    gap.className = "note-gap";
    gap.style.height = (banner.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom)) + "px";
    banner.parentNode.insertBefore(gap, banner);
    noteLeaving = false;
    banner.classList.remove("leaving");
    if (last) paint(last);          // the note is put away; everything else takes its full size
    void gap.offsetHeight;
    gap.style.height = "0px";
    setTimeout(() => gap.remove(), 650);
  }, 350);
}
document.addEventListener("pointerdown", dismissUpdated, true);
document.addEventListener("keydown", dismissUpdated, true);

function paintStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { setText(el, t(el.dataset.t)); });
  document.querySelectorAll(".lang button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  // Hovering the mark says it can be clicked, which is the only hint that the
  // story behind the name is in there at all.
  $("mark").title = t("aboutHint");
  placePill(true);
}

function showUpdating(on, s) {
  updating = on;
  $("updating").hidden = !on;
  if (!on) return;
  $("updatingBody").textContent = s && s.platform === "macos" ? t("updatingMac")
    : (s && s.connected ? t("updatingOn") : t("updatingOff"));
}

// The app writes dates as "1 Oct 19:13"; in Russian the month is said in Russian.
const MONTHS_RU = { Jan: "янв", Feb: "фев", Mar: "мар", Apr: "апр", May: "мая", Jun: "июн",
  Jul: "июл", Aug: "авг", Sep: "сен", Oct: "окт", Nov: "ноя", Dec: "дек" };
function localDate(d) {
  return lang === "ru" ? d.replace(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/, (m) => MONTHS_RU[m]) : d;
}

function paint(s) {
  // A new look or a new version: start again from the page now being served.
  if (loadedRev === null) loadedRev = s.uiRev;
  if (loadedVersion === null) loadedVersion = s.version;
  if ((s.uiRev !== undefined && s.uiRev !== loadedRev) || s.version !== loadedVersion) {
    location.reload();
    return;
  }
  last = s;
  // The saved language first, so the very first frame is not drawn in Russian
  // for someone who chose English (it used to flash for two seconds).
  if (s.lang && s.lang !== lang) { lang = s.lang; paintStatic(); }
  $("owner").textContent = s.owner || "";
  setText($("version"), s.subFetched
    ? "v" + s.version + "  ·  " + t("updatedAt") + " " + localDate(s.subFetched)
    : "v" + s.version);

  const setup = !s.hasSub;
  $("setup").hidden = !setup;
  $("main").hidden = setup;
  $("about").hidden = !aboutOpen;

  const up = s.update || {};
  showUpdating(!!up.busy, s);
  // Straight after an update installed itself the banner says so, in the
  // quieter green, so the restart is explained rather than mysterious.
  const done = !up.available && !!s.justUpdated && (noteLeaving || !updatedSeen(s.version));
  const banner = $("updateBanner");
  banner.hidden = !(up.available || done);
  banner.classList.toggle("done", done);
  setText(banner.querySelector("b"), done ? t("updatedTitle") : t("updateTitle"));
  $("updateBtn").hidden = done;
  if (done) {
    $("updateNotes").textContent = t("updatedTo") + " " + s.version;
  } else if (up.available) {
    $("updateNotes").textContent = up.notes || ("v" + up.version);
    $("updateBtn").disabled = up.busy;
    $("updateBtn").textContent = up.busy ? t("updating") : t("updateNow");
  }
  if (setup) { rain(false); return; }

  const busy = s.busy !== "";
  rain(s.connected && !busy);

  const power = $("power");
  power.disabled = busy;
  // The button lifts the moment connecting starts, not when the tunnel is up a
  // second later: the press should answer the finger, not the network.
  power.classList.toggle("on", (s.connected && !busy) || s.busy === "connecting");
  // in a span, so the carving acts on the letters and not the button
  const word = busy ? "..." : (s.connected ? t("on") : t("off"));
  if (!power.firstElementChild) power.innerHTML = '<span class="lbl"></span>';
  setText(power.firstElementChild, word);

  // The button says what the state IS. Underneath: what that means, and then
  // what to do about it. Deliberately says nothing about addresses or traffic,
  // because the people using this want to know one thing.
  const state = $("state");
  state.classList.toggle("on", s.connected && !busy);
  state.classList.toggle("busy", busy);
  setText(state, busy
    ? (s.busy === "connecting" ? t("connecting") : t("disconnecting"))
    : (s.connected ? (s.exitIP ? t("active") : t("checking")) : ""));

  let detail = "";
  if (!busy) {
    if (s.connected) detail = t("background");
    else detail = s.platform === "macos" ? t("macPassword") : t("tapOn");
  }
  setText($("detail"), detail);

  const alert = $("alert");
  const err = s.error || up.error || "";
  alert.hidden = !err;
  alert.textContent = err;

  // The server names come from the subscription and stay as written. Only the
  // one English word in them is translated, so a Russian reader is not left
  // guessing which of the two is the spare.
  const sel = $("entry");
  const sig = lang + "|" + s.entries.join("|");
  if (sel.dataset.sig !== sig) {
    sel.dataset.sig = sig;
    sel.innerHTML = "";
    s.entries.forEach((name, i) => {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = name.replace(/\((backup|запасной)\)/i, t("backupWord"));
      sel.appendChild(o);
    });
  }
  sel.value = String(s.entry);
  // With one server there is nothing to choose, so the picker is not shown.
  sel.closest(".card").hidden = s.entries.length < 2;

  // Windows keeps Quit in the tray menu. macOS has no tray, so without this
  // there is no way to stop it short of Activity Monitor.
  $("quitRow").hidden = s.platform !== "macos";

  for (const pair of [["autoStart", s.autoStart], ["autoUpdate", s.autoUpdate]]) {
    if (document.activeElement !== $(pair[0])) $(pair[0]).checked = pair[1];
  }
  wordsReady = true;

}

async function api(path, body) {
  const opt = body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {};
  const r = await fetch(path, opt);
  return r.json();
}

async function poll() {
  try {
    paint(await api("/api/status"));
  } catch (e) {
    // Mid-update the app is briefly not there. That is not the person having
    // chosen Quit, so keep saying it is updating.
    if (updating) return;
    const alert = $("alert");
    alert.hidden = false;
    alert.textContent = t("offline");
  }
}

$("power").addEventListener("click", async () => {
  const going = last && last.connected ? "/api/disconnect" : "/api/connect";
  paint(Object.assign({}, last, { busy: going.endsWith("disconnect") ? "disconnecting" : "connecting" }));
  const r = await api(going, {});
  if (r.status) paint(r.status);
});

$("entry").addEventListener("change", async (e) => {
  const r = await api("/api/settings", { entry: Number(e.target.value) });
  if (r.status) paint(r.status);
});

["autoStart", "autoUpdate"].forEach((id) => {
  $(id).addEventListener("change", async (e) => {
    const body = {};
    body[id] = e.target.checked;
    const r = await api("/api/settings", body);
    if (r.status) paint(r.status);
  });
});

$("updateBtn").addEventListener("click", async () => {
  $("updateBtn").disabled = true;
  $("updateBtn").textContent = t("updating");
  showUpdating(true, last);
  const r = await api("/api/update", {});
  if (r.ok) {
    // Polling carries on; the page reloads when the new version answers.
  } else if (r.status) {
    showUpdating(false);
    paint(r.status);
  }
});

$("quit").addEventListener("click", async () => {
  await api("/api/quit", {});
  rain(false);
  document.body.innerHTML = '<div class="app"><p style="color:#7aa68a">' + t("offline") + "</p></div>";
});

$("saveSub").addEventListener("click", async () => {
  const r = await api("/api/settings", { subURL: $("subInput").value.trim() });
  if (r.status) paint(r.status);
  if (r.error) { $("alert").hidden = false; $("alert").textContent = r.error; }
});

document.querySelectorAll(".lang button").forEach((b) => {
  b.addEventListener("click", async () => {
    lang = b.dataset.lang;
    // The cached status still says the old language, and repainting from it
    // would set the language straight back. This is why the toggle appeared to
    // do nothing: it worked, then immediately undid itself.
    if (last) last.lang = lang;
    paintStatic();
    if (last) paint(last);
    const r = await api("/api/settings", { lang });
    if (r.status) paint(r.status);
  });
});

// The story page's words arrive and leave like every other wording: letter by
// letter, at scattered moments. Opening shows the page at once and lets the
// words (and the photograph) fade in; closing fades them out and only then puts
// the page away.
let aboutGen = 0;
function aboutWords() { return [...document.querySelectorAll("#about [data-t]")]; }
function letterIn(el, text, hidden) {
  el.textContent = "";
  for (const ch of text) {
    const sp = document.createElement("span");
    sp.className = hidden ? "ch out" : "ch"; sp.textContent = ch;
    sp.style.transitionDelay = Math.random() * FADE_SPREAD + "ms";
    el.appendChild(sp);
  }
}
function revealAbout() {
  const words = aboutWords();
  for (const el of words) letterIn(el, el.dataset.txt || el.textContent, true);
  $("about").classList.add("in");
  void $("about").offsetWidth;
  for (const el of words) el.querySelectorAll(".ch").forEach((c) => c.classList.remove("out"));
}
function toggleAbout(open) {
  const gen = ++aboutGen;
  if (stillMotion) { aboutOpen = open; $("about").classList.toggle("shown", open); if (last) paint(last); if (open) $("about").scrollTop = 0; return; }
  if (open) {
    aboutOpen = true;
    aboutOpenedAt = performance.now();
    $("about").classList.remove("in", "shown");
    if (last) paint(last);
    $("about").scrollTop = 0;
    void $("about").offsetWidth;
    $("about").classList.add("shown");      // the page itself fades in over the main screen
    revealAbout();
    return;
  }
  // closing: the words scatter away, then the page goes
  for (const el of aboutWords()) el.querySelectorAll(".ch").forEach((c) => {
    c.style.transitionDelay = Math.random() * FADE_SPREAD + "ms"; c.classList.add("out");
  });
  $("about").classList.remove("in");
  // then the page itself fades away, so the main screen comes back through it
  // instead of flashing in (Elijah, 2 Oct 2026)
  setTimeout(() => { if (aboutGen === gen) $("about").classList.remove("shown"); }, FADE_SPREAD + FADE_MS - 150);
  setTimeout(() => { if (aboutGen !== gen) return; aboutOpen = false; if (last) paint(last); }, FADE_SPREAD + FADE_MS + 200);
}
$("mark").addEventListener("click", () => toggleAbout(!aboutOpen));
$("mark").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleAbout(!aboutOpen); }
});
// A click anywhere on the story page closes it (the close key is inside it, so
// it needs no handler of its own). The first moments after opening are ignored,
// so a double-click on the square does not open and shut it at once.
let aboutOpenedAt = 0;
$("about").addEventListener("click", () => {
  if (aboutOpen && performance.now() - aboutOpenedAt > 400) toggleAbout(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && aboutOpen) toggleAbout(false); });

// Inside AREPO's own window (1.2.11+) the page draws the title bar: the app
// exposes exactly these three calls there and nowhere else.
if (typeof window.arepoDrag === "function") {
  document.documentElement.classList.add("framed");
  $("titlebar").hidden = false;
  $("titlebar").addEventListener("mousedown", (e) => {
    if (e.button === 0 && e.target === $("titlebar")) window.arepoDrag();
  });
  $("tbMin").addEventListener("click", () => window.arepoMinimize());
  $("tbClose").addEventListener("click", () => window.arepoClose());
}

drawMark();
paintStatic();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
